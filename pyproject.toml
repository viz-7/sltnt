[project]
name = "sltnt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishnu", email = "SnowSneeze@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "envpool>=1.2.5",
    "gym>=0.26.2",
    "numpy>=2.4.6",
    "tensorboard>=2.21.0",
    "torch>=2.11.0",
    "tyro>=1.0.16",
    "wandb>=0.31.0",
]

[project.scripts]
sltnt = "sltnt:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
